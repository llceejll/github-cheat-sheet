name: Link Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install awesome_bot
        run: gem install awesome_bot

      - name: Check links
        run: |
          wl="https://github.com/rails/rails/compare/master@"
          wl="$wl,https://docs.github.com/en/articles/"
          wl="$wl,youtube"
          wl="$wl,chrome.google.com/webstore"
          wl="$wl,https://github.com/mathiasbynens/dotfiles/blob/master/.gitconfig"
          wl="$wl,https://github.com/user/repo/compare/"
          wl="$wl,vimeo"
          wl="$wl,git.io"
          awesome_bot README.md       --allow-dupe --allow-redirect --white-list "$wl"
          awesome_bot README.ko.md    --allow-dupe --allow-redirect --white-list "$wl"
          awesome_bot README.ja.md    --allow-dupe --allow-redirect --white-list "$wl"
          awesome_bot README.zh-cn.md --allow-dupe --allow-redirect --white-list "$wl"
          awesome_bot README.zh-tw.md --allow-dupe --allow-redirect --white-list "$wl"
